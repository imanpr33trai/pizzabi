name: Publish Backend Container

on:
  workflow_call:
    inputs:
      mode:
        description: "Image build mode: validate (no push), preview (preview tags), or release (semver tags)"
        required: true
        type: string
      push:
        description: "Whether to push the built image to GHCR"
        required: true
        type: boolean
      tag_name:
        description: "Git tag name for release mode (e.g., v1.0.0)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "Push preview tags to GHCR (false = build validation only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify-backend-for-manual-dispatch:
    name: Security Audit & Backend Tests (Manual Dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run security and policy audit
        run: bash infra/security-check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (dependency and build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared contracts & backend tests (S3 disabled by default)
        env:
          S3_ENABLED: "false"
          PIZZORA_ENV: "development"
        run: ./gradlew -PbackendOnly=true :shared:contracts:test :backend:test --no-daemon

  build-and-publish:
    name: Build, Validate & Publish Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || needs.verify-backend-for-manual-dispatch.result == 'success') }}
    needs: [verify-backend-for-manual-dispatch]
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pizzora
          POSTGRES_PASSWORD: pizzora_dev_password
          POSTGRES_DB: pizzora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pizzora -d pizzora"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image publishing mode and tags
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.mode }}" ]; then
            MODE="${{ inputs.mode }}"
            SHOULD_PUSH="${{ inputs.push }}"
            TAG_NAME="${{ inputs.tag_name }}"
          else
            MODE="preview"
            if [ "${{ inputs.publish_preview }}" = "true" ]; then
              SHOULD_PUSH="true"
            else
              SHOULD_PUSH="false"
            fi
            TAG_NAME=""
          fi

          if [ "$MODE" != "validate" ] && [ "$MODE" != "preview" ] && [ "$MODE" != "release" ]; then
            echo "ERROR: Invalid backend image mode '$MODE'." >&2
            exit 1
          fi

          # Safety guards: PRs and validate mode never push; preview pushes only from main; release only from semver tags
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$SHOULD_PUSH" = "true" ]; then
            echo "ERROR: Pull requests must never push Docker images." >&2
            exit 1
          fi
          if [ "$MODE" = "validate" ] && [ "$SHOULD_PUSH" = "true" ]; then
            echo "ERROR: Validate mode must never push Docker images." >&2
            exit 1
          fi
          if [ "$MODE" = "preview" ] && [ "$SHOULD_PUSH" = "true" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Preview Docker tags can only be published from main (current ref: '${{ github.ref }}')." >&2
            exit 1
          fi

          if [ "$MODE" = "release" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref_type }}" != "tag" ]; then
              echo "ERROR: Release Docker image tags can only be published from a version tag." >&2
              exit 1
            fi
            if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$ ]]; then
              echo "ERROR: Tag '$TAG_NAME' does not match semantic version format vMAJOR.MINOR.PATCH[-PRERELEASE]." >&2
              exit 1
            fi
            if [ -n "${BASH_REMATCH[4]:-}" ]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "should_push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.mode.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preview image metadata
        if: steps.mode.outputs.mode != 'release'
        id: meta_preview
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/imanpr33trai/pizzora-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=preview-main,enable=${{ github.ref == 'refs/heads/main' && steps.mode.outputs.mode == 'preview' }}
            type=raw,value=preview-${{ steps.mode.outputs.short_sha }},enable=${{ steps.mode.outputs.mode == 'preview' }}
            type=raw,value=pr-${{ github.event.pull_request.number || steps.mode.outputs.short_sha }},enable=${{ steps.mode.outputs.mode == 'validate' }}

      - name: Generate production release image metadata
        if: steps.mode.outputs.mode == 'release'
        id: meta_release
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/imanpr33trai/pizzora-backend
          flavor: |
            latest=${{ steps.mode.outputs.is_prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # Build first without pushing so runtime validation can gate publication.
      # Docker layer caches make the second (push) build nearly free.
      - name: Build backend Docker image (local, for validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          load: true
          push: false
          tags: ${{ steps.mode.outputs.mode == 'release' && steps.meta_release.outputs.tags || steps.meta_preview.outputs.tags }}
          labels: ${{ steps.mode.outputs.mode == 'release' && steps.meta_release.outputs.labels || steps.meta_preview.outputs.labels }}
          cache-from: type=gha,scope=kotlin-backend-image
          cache-to: type=gha,scope=kotlin-backend-image,mode=max

      - name: Runtime smoke validation (entrypoint, health, runtime libs, non-root, PG/Redis config)
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "release" ]; then
            IMAGE="$(printf '%s' "${{ steps.meta_release.outputs.tags }}" | head -n 1)"
          else
            IMAGE="$(printf '%s' "${{ steps.meta_preview.outputs.tags }}" | head -n 1)"
          fi
          echo "Smoke-validating image: $IMAGE"

          docker run -d --name pizzora-kotlin-smoke --network host \
            -e DATABASE_URL="jdbc:postgresql://127.0.0.1:5432/pizzora" \
            -e DATABASE_USER=pizzora \
            -e DATABASE_PASSWORD=pizzora_dev_password \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e RUN_MIGRATIONS_ON_STARTUP=true \
            -e PIZZORA_ENV=development \
            -e S3_ENABLED=false \
            -e PORT=8080 \
            "$IMAGE"

          cleanup() {
            docker logs pizzora-kotlin-smoke 2>&1 | tail -40 || true
            docker rm -f pizzora-kotlin-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          UP=""
          for _ in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/v1/health/live >/dev/null 2>&1; then UP=1; break; fi
            sleep 2
          done
          if [ -z "$UP" ]; then
            echo "ERROR: Kotlin backend container did not serve /api/v1/health/live within 90s." >&2
            exit 1
          fi

          READY_BODY="$(curl -sf http://127.0.0.1:8080/api/v1/health/ready)" || {
            echo "ERROR: /api/v1/health/ready did not respond successfully." >&2
            exit 1
          }
          echo "$READY_BODY"
          if ! echo "$READY_BODY" | grep -q '"status":"HEALTHY"'; then
            echo "ERROR: Kotlin backend readiness is not HEALTHY even with PostgreSQL and Redis available." >&2
            exit 1
          fi

          RUN_AS="$(docker exec pizzora-kotlin-smoke id -un)"
          if [ "$RUN_AS" = "root" ]; then
            echo "ERROR: Kotlin container must run as a non-root user (got 'root')." >&2
            exit 1
          fi
          LIB_COUNT="$(docker exec pizzora-kotlin-smoke sh -c 'ls /app/libs/*.jar 2>/dev/null | wc -l')"
          if [ "${LIB_COUNT:-0}" -lt 1 ]; then
            echo "ERROR: No packaged jars found under /app/libs; backend packaging is broken." >&2
            exit 1
          fi
          echo "Kotlin image runtime validation passed."

      - name: Push backend Docker image to GHCR
        if: steps.mode.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: ${{ steps.mode.outputs.mode == 'release' && steps.meta_release.outputs.tags || steps.meta_preview.outputs.tags }}
          labels: ${{ steps.mode.outputs.mode == 'release' && steps.meta_release.outputs.labels || steps.meta_preview.outputs.labels }}
          cache-from: type=gha,scope=kotlin-backend-image
          cache-to: type=gha,scope=kotlin-backend-image,mode=max
