name: PIZZORA Security, CI & Release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v[0-9]*.[0-9]*.[0-9]*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pizzora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    name: Secret, Play Policy & Manifest Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Phase 18 Security & Policy Check
        run: bash infra/security-check.sh

  test-contracts-and-backend:
    name: Contracts & Backend Tests
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Shared Contracts Tests
        run: ./gradlew -PbackendOnly=true :shared:contracts:test --no-daemon

      - name: Run Backend Test Suite (S3 disabled by default)
        env:
          S3_ENABLED: "false"
          PIZZORA_ENV: "development"
        run: ./gradlew -PbackendOnly=true :backend:test --no-daemon

  test-rust-core:
    name: Rust Workspace & Core Parity
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Verify Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy across workspace with warnings denied
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify pizzora-core purity (no I/O, runtime, crypto, or FFI dependencies)
        working-directory: rust
        run: |
          set -euo pipefail
          TREE="$(cargo tree -p pizzora-core -e no-dev)"
          echo "$TREE"
          if echo "$TREE" | grep -E '\b(tokio|sqlx|reqwest|uniffi|argon2|aes-gcm|lettre|axum|redis)\b'; then
            echo "ERROR: Prohibited runtime/IO/crypto/FFI dependency found in pizzora-core." >&2
            exit 1
          fi

      - name: Run every Rust workspace test
        working-directory: rust
        run: cargo test --workspace --all-features --locked

      - name: Check full 8-crate Rust workspace
        working-directory: rust
        run: cargo check --workspace --all-features --locked

  test-android:
    name: Android Unit & Robolectric Tests
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for shared/contracts toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21 (for AGP 9 & Robolectric SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain (1.88.0 host for UniFFI bindgen & Robolectric)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-unknown-linux-gnu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run UniFFI Host Bindgen and Android Unit & Robolectric Tests
        run: ./gradlew :app:generateUniFfiKotlinBindings :app:testDebugUnitTest -PpizzoraRequireRust=true --no-daemon

  test-android-instrumented:
    name: Android Instrumentation Tests (Emulator)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK_ROOT/ndk/27.2.12479018" ]; then
            yes | "$SDKMANAGER" "ndk;27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Android instrumentation tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PpizzoraRequireRust=true --no-daemon

  build-preview-apk:
    name: Build Android Debug Preview APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [security-audit, test-contracts-and-backend, test-android, test-android-instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain & cargo-ndk 4.1.2 for Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk 4.1.2 and Android NDK 27.2.12479018
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/ndk/27.2.12479018" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null || true
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary debug keystore for preview build
        run: |
          set -euo pipefail
          rm -f debug.keystore
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug Preview APK
        run: ./gradlew :app:assembleDebug -PpizzoraRequireRust=true --no-daemon

      - name: Verify UniFFI Native ABI Packaging (arm64-v8a & x86_64)
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          ZIP_LIST="$(unzip -l "$APK_SRC")"
          for entry in \
            "lib/arm64-v8a/libpizzora_uniffi.so" \
            "lib/x86_64/libpizzora_uniffi.so" \
            "lib/arm64-v8a/libjnidispatch.so" \
            "lib/x86_64/libjnidispatch.so"; do
            if ! echo "$ZIP_LIST" | grep -q "$entry"; then
              echo "ERROR: Expected native library '$entry' missing from preview APK." >&2
              exit 1
            fi
          done

      - name: Stage Preview APK Artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARTIFACT_ID="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ARTIFACT_ID="main-${SHORT_SHA}"
          else
            ARTIFACT_ID="manual-${SHORT_SHA}"
          fi
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Expected debug APK at $APK_SRC was not generated." >&2
            exit 1
          fi
          mkdir -p preview-apks
          APK_NAME="pizzora-preview-${ARTIFACT_ID}.apk"
          cp "$APK_SRC" "preview-apks/${APK_NAME}"
          echo "artifact_name=pizzora-preview-${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "apk_path=preview-apks/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Preview APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 14

  backend-docker:
    name: Backend Docker Image (${{ github.ref_type == 'tag' && 'Release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Preview Push' || 'Validate Only') }})
    needs: [security-audit, test-contracts-and-backend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-backend.yml
    with:
      mode: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && 'release' || ((github.event_name == 'push' && github.ref == 'refs/heads/main') && 'preview' || 'validate') }}
      push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
      tag_name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  build-release-apk:
    name: Build Signed Production Release APK
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [security-audit, test-contracts-and-backend, test-android, test-android-instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      apk_filename: ${{ steps.package.outputs.apk_filename }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate semantic version tag and derive Android version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "ERROR: Release tag '$TAG' must follow semantic versioning (e.g. v1.0.0)." >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          PRERELEASE="${BASH_REMATCH[4]:-}"

          if [ "$MINOR" -ge 1000 ] || [ "$PATCH" -ge 1000 ]; then
            echo "ERROR: MINOR ($MINOR) and PATCH ($PATCH) must be < 1000 for deterministic versionCode." >&2
            exit 1
          fi

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}${PRERELEASE}"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          if [ "$VERSION_CODE" -lt 1 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "ERROR: Computed versionCode ($VERSION_CODE) is out of Android bounds." >&2
            exit 1
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [ -n "$PRERELEASE" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved release versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Validate required production signing secrets and decode upload keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing required secret ANDROID_KEYSTORE_BASE64 for production release." >&2
            exit 1
          fi
          if [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "ERROR: Missing required secret ANDROID_STORE_PASSWORD for production release." >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: Missing required secret ANDROID_KEY_PASSWORD for production release." >&2
            exit 1
          fi

          RELEASE_KEYSTORE="${RUNNER_TEMP}/pizzora-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RELEASE_KEYSTORE"
          chmod 600 "$RELEASE_KEYSTORE"

          # Verify keystore readability and expected upload alias without exposing secrets
          if ! keytool -list -keystore "$RELEASE_KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
            echo "ERROR: Decoded keystore is invalid, store password is wrong, or alias 'upload' is missing." >&2
            exit 1
          fi

          echo "keystore_path=$RELEASE_KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain & cargo-ndk 4.1.2 for Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk 4.1.2 and Android NDK 27.2.12479018
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/ndk/27.2.12479018" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null || true
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        env:
          PIZZORA_API_BASE_URL: ${{ vars.PIZZORA_API_BASE_URL || 'https://api.pizzora.app' }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PpizzoraRequireRust=true --no-daemon \
            -PpizzoraVersionCode="${{ steps.version.outputs.version_code }}" \
            -PpizzoraVersionName="${{ steps.version.outputs.version_name }}"

      - name: Verify release APK signature, native ABIs, and stage versioned asset
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Expected signed release APK at $APK_SRC was not generated." >&2
            exit 1
          fi
          ZIP_LIST="$(unzip -l "$APK_SRC")"
          for entry in \
            "lib/arm64-v8a/libpizzora_uniffi.so" \
            "lib/x86_64/libpizzora_uniffi.so" \
            "lib/arm64-v8a/libjnidispatch.so" \
            "lib/x86_64/libjnidispatch.so"; do
            if ! echo "$ZIP_LIST" | grep -q "$entry"; then
              echo "ERROR: Expected native library '$entry' missing from release APK." >&2
              exit 1
            fi
          done

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Android apksigner binary not found under '$SDK_ROOT/build-tools'." >&2
            exit 1
          fi

          SIGNER_INFO="$("$APKSIGNER" verify --print-certs "$APK_SRC")"
          echo "$SIGNER_INFO"
          if echo "$SIGNER_INFO" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release APK is signed with a debug certificate!" >&2
            exit 1
          fi

          mkdir -p release-apks
          APK_FILENAME="pizzora-${{ steps.version.outputs.tag_name }}.apk"
          cp "$APK_SRC" "release-apks/${APK_FILENAME}"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary upload keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/pizzora-upload-key.jks"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pizzora-release-${{ steps.version.outputs.tag_name }}
          path: release-apks/${{ steps.package.outputs.apk_filename }}
          retention-days: 30

  publish-github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build-release-apk, backend-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: pizzora-release-${{ needs.build-release-apk.outputs.tag_name }}
          path: release-assets

      - name: Publish GitHub Release for ${{ needs.build-release-apk.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build-release-apk.outputs.tag_name }}
          APK_FILE: release-assets/${{ needs.build-release-apk.outputs.apk_filename }}
          IS_PRERELEASE: ${{ needs.build-release-apk.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Signed release APK '$APK_FILE' not found." >&2
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG="--latest"
          fi

          gh release create "$TAG_NAME" "$APK_FILE" \
            --repo "${{ github.repository }}" \
            --title "PIZZORA $TAG_NAME" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG
