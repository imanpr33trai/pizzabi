name: PIZZORA Security & CI Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Secret, Play Policy & Manifest Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 18 Security & Policy Check
        run: bash infra/security-check.sh

  gradle-verify:
    name: Contracts, Backend, Android Tests & APK Release
    runs-on: ubuntu-latest
    needs: security-audit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (for backend toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up JDK 21 (for AGP 9 & Robolectric SDK 36)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Shared Contracts Tests
        run: gradle :shared:contracts:test --no-daemon
      - name: Run Backend Test Suite
        run: gradle :backend:test --no-daemon
      - name: Run Android Unit & Robolectric Suite
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Prepare CI Keystores for Debug & Release APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            CI_RELEASE_KS="${RUNNER_TEMP:-/tmp}/upload-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$CI_RELEASE_KS"
            echo "KEYSTORE_PATH=$CI_RELEASE_KS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ ! -f "${KEYSTORE_PATH:-my-upload-key.jks}" ]; then
            CI_RELEASE_KS="${RUNNER_TEMP:-/tmp}/ci-upload-key.jks"
            rm -f "$CI_RELEASE_KS"
            keytool -genkeypair -noprompt -v \
              -keystore "$CI_RELEASE_KS" \
              -storepass ci-release-pass \
              -alias upload \
              -keypass ci-release-pass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CI Release,O=Android,C=US"
            echo "KEYSTORE_PATH=$CI_RELEASE_KS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=ci-release-pass" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=ci-release-pass" >> "$GITHUB_ENV"
          fi
      - name: Build Debug & Release APKs
        env:
          PIZZORA_API_BASE_URL: ${{ vars.PIZZORA_API_BASE_URL || 'https://api.pizzora.app' }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Prepare Release APK Assets
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v1.0.${{ github.run_number }}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk "release-apks/pizzora-${RELEASE_TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/pizzora-${RELEASE_TAG}-debug.apk"
      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pizzora-apks-${{ env.RELEASE_TAG }}
          path: release-apks/*.apk
          retention-days: 30
      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PIZZORA ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-apks/pizzora-${{ env.RELEASE_TAG }}-release.apk
            release-apks/pizzora-${{ env.RELEASE_TAG }}-debug.apk
