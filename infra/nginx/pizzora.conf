# Alternative Nginx + Certbot reverse proxy configuration for PIZZORA
# Place at /etc/nginx/sites-available/pizzora.conf and symlink to sites-enabled.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pizzora_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pizzora.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pizzora.app;

    ssl_certificate     /etc/letsencrypt/live/api.pizzora.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pizzora.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    # Block public access to Prometheus /metrics
    location = /metrics {
        deny all;
        return 403;
    }

    # WebSocket endpoint (/ws/v1/events)
    location /ws/ {
        proxy_pass http://pizzora_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # REST API (/api/v1/*)
    location / {
        proxy_pass http://pizzora_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
