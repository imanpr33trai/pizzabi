# Preserved Phase 9 Ktor Rollback Production Compose Stack
# Keep available until the post-cutover stability window completes and Ktor retirement is approved.
#
# Rollback rules (Plan Section 12.10):
# - Never automatically run Flyway on rollback if additive V4+ SQLx migrations have already run.
# - Both `backend` and `worker` enforce RUN_MIGRATIONS_ON_STARTUP=false and verify schema compatibility read-only.
# - Set BACKEND_IMAGE to the pinned pre-cutover Ktor image digest (e.g. ghcr.io/imanpr33trai/pizzora-backend@sha256:...).

services:
  postgres:
    image: postgres:18-alpine
    container_name: pizzora-prod-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/bin/true
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pizzora_prod_pgdata:/var/lib/postgresql
      - pizzora_prod_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: pizzora-prod-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - pizzora_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/imanpr33trai/pizzora-backend:latest}
    container_name: pizzora-prod-api
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env.prod
    environment:
      PIZZORA_ENV: production
      RUN_MIGRATIONS_ON_STARTUP: "false"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/imanpr33trai/pizzora-backend:latest}
    container_name: pizzora-prod-worker
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env.prod
    environment:
      PIZZORA_ENV: production
      RUN_MIGRATIONS_ON_STARTUP: "false"
      WORKER_HEALTH_PORT: "8081"
    command: ["java", "-cp", "/app/libs/*", "com.pizzora.backend.worker.WorkerMainKt"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/worker >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  caddy:
    image: caddy:2.9-alpine
    container_name: pizzora-prod-caddy
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pizzora_caddy_data:/data
      - pizzora_caddy_config:/config

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: pizzora-prod-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - pizzora_prometheus_data:/prometheus

volumes:
  pizzora_prod_pgdata:
  pizzora_prod_redis:
  pizzora_prod_backups:
  pizzora_caddy_data:
  pizzora_caddy_config:
  pizzora_prometheus_data:
